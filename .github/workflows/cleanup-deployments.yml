name: Cleanup ghost deployments

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Mondays 04:00 UTC
    - cron: '0 4 * * 1'

permissions:
  contents: read
  deployments: write

jobs:
  cleanup:
    name: Delete deployments pointing at unreachable commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete unreachable deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Collect first, then delete: paginating while deleting shifts pages.
          # The GitHub API answers out-of-range pages with 200 and an empty
          # array, so an empty batch (not an api error) is the exit condition.
          page=1
          : > /tmp/deployments.txt
          while :; do
            batch=$(gh api \
              "repos/${{ github.repository }}/deployments?per_page=100&page=$page" \
              --jq '.[] | [.id, .sha] | @tsv')
            [ -z "$batch" ] && break
            printf '%s\n' "$batch" >> /tmp/deployments.txt
            page=$((page + 1))
          done

          while IFS=$'\t' read -r id sha; do
            [ -z "$id" ] && continue
            if git cat-file -e "${sha}^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$sha" HEAD; then
              echo "keeping $id ($sha is reachable)"
              continue
            fi
            echo "deleting $id ($sha is not in history)"
            # A deployment with active statuses cannot be deleted directly.
            gh api -X POST "repos/${{ github.repository }}/deployments/$id/statuses" \
              -f state=inactive \
              -f description='cleanup of unreachable deployment' >/dev/null 2>&1 || true
            gh api -X DELETE "repos/${{ github.repository }}/deployments/$id" \
              || echo "  could not delete $id"
          done < /tmp/deployments.txt
