name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, types, format and web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm exec prettier --check "**/*.{astro,css,mjs,md,ts,tsx}"

      - name: Lint
        run: pnpm exec turbo lint

      - name: Type check
        run: pnpm exec turbo check-types

      - name: Web tests
        run: pnpm exec turbo test --filter=web

  cms-integration:
    name: CMS integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cms
      PAYLOAD_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Integration tests
        run: pnpm test:int
        working-directory: apps/cms

  deployment-record:
    name: Record production deployment
    runs-on: ubuntu-latest
    needs: [checks, cms-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write
    steps:
      # Vercel builds the same commit independently; its own status checks on
      # the commit reflect the real build outcome. This record binds the push
      # to the live site in GitHub's Environments/Deployments view.
      - name: Create deployment record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # required_contexts=[] skips the commit-status gate: Vercel's builds
          # race this job and may still be pending here.
          id=$(printf '{"ref":"%s","environment":"tonyzoooo.me","required_contexts":[]}' \
            "${{ github.sha }}" \
            | gh api "repos/${{ github.repository }}/deployments" \
              --input - --jq .id)
          gh api "repos/${{ github.repository }}/deployments/$id/statuses" \
            -f state=success \
            -f environment_url='https://tonyzoooo.me' \
            -f target_url='https://tonyzoooo.me' \
            -F production_environment=true
